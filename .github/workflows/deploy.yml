name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

#      - name: Install mamba
#        uses: mamba-org/provision-with-micromamba@main
#        with:
#          micromamba-version: '1.4.2'
#          environment-file: 'build-environment.yml'
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: >-
          voici
          build
          --contents=content
          --output-dir=dist
          --template=reveal
          --VoilaConfiguration.theme=dark
          --VoilaConfiguration.resources="{'reveal': {'theme': 'dracula', 'scroll': False, 'url_prefix': 'https://unpkg.com/reveal.js@5.1.0'}}"

      # The reveal template renders <script src="{fullStaticUrl}/reveal.js">, but only
      # voila ships that bundle (under its base template) -- voici does not copy it into
      # its own static dir. Without this the script 404s, Reveal never initializes, and
      # every deck renders as a blank background once the cells have run.
      - name: Vendor the reveal.js bundle into the voici build
        run: |
          python - <<'EOF'
          import pathlib, shutil
          from jupyter_core.paths import jupyter_path

          dest = pathlib.Path("dist/voici/build/reveal.js")
          for root in jupyter_path():
              src = pathlib.Path(root) / "voila" / "templates" / "base" / "static" / "reveal.js"
              if src.is_file():
                  shutil.copy(src, dest)
                  print(f"copied {src} -> {dest}")
                  break
          else:
              raise SystemExit("could not find voila's reveal.js in any Jupyter data dir")
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

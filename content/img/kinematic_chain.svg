<svg width="100%" viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#F8F8F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#FF79C6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Part 1 -->
  <rect x="50" y="20" width="220" height="70" rx="10" fill="none" stroke="#6272A4" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="62" y="36" font-size="11" fill="#BD93F9" font-family="sans-serif">Part 1</text>

  <!-- Part 2 -->
  <rect x="330" y="20" width="80" height="170" rx="10" fill="none" stroke="#6272A4" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="342" y="36" font-size="11" fill="#BD93F9" font-family="sans-serif">Part 2</text>

  <!-- Part 3 -->
  <rect x="50" y="125" width="220" height="70" rx="10" fill="none" stroke="#6272A4" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="62" y="141" font-size="11" fill="#BD93F9" font-family="sans-serif">Part 3</text>

  <!-- Node 0: cx=100, cy=57 -->
  <circle cx="100" cy="57" r="20" fill="#6272A4" stroke="#BD93F9" stroke-width="1.5"/>
  <text x="100" y="57" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F8F8F2" font-family="sans-serif">0</text>

  <!-- Node 1: cx=240, cy=57 -->
  <circle cx="240" cy="57" r="20" fill="#6272A4" stroke="#BD93F9" stroke-width="1.5"/>
  <text x="240" y="57" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F8F8F2" font-family="sans-serif">1</text>

  <!-- Node 2: cx=370, cy=57 -->
  <circle cx="370" cy="57" r="20" fill="#6272A4" stroke="#BD93F9" stroke-width="1.5"/>
  <text x="370" y="57" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F8F8F2" font-family="sans-serif">2</text>

  <!-- Node 3: cx=370, cy=160 -->
  <circle cx="370" cy="160" r="20" fill="#6272A4" stroke="#BD93F9" stroke-width="1.5"/>
  <text x="370" y="160" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F8F8F2" font-family="sans-serif">3</text>

  <!-- Node 4: cx=240, cy=160 -->
  <circle cx="240" cy="160" r="20" fill="#6272A4" stroke="#BD93F9" stroke-width="1.5"/>
  <text x="240" y="160" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F8F8F2" font-family="sans-serif">4</text>

  <!-- Node 5: cx=100, cy=160 -->
  <circle cx="100" cy="160" r="20" fill="#6272A4" stroke="#BD93F9" stroke-width="1.5"/>
  <text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#F8F8F2" font-family="sans-serif">5</text>

  <!-- Arrow 0 → 1 -->
  <line x1="120" y1="57" x2="218" y2="57" stroke="#F8F8F2" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Arrow 1 → 2 -->
  <line x1="260" y1="57" x2="348" y2="57" stroke="#F8F8F2" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Arrow 2 → 3 -->
  <line x1="370" y1="77" x2="370" y2="138" stroke="#F8F8F2" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Arrow 3 → 4 -->
  <line x1="348" y1="160" x2="262" y2="160" stroke="#F8F8F2" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Arrow 4 → 5 -->
  <line x1="218" y1="160" x2="122" y2="160" stroke="#F8F8F2" stroke-width="1" marker-end="url(#arr)"/>

  <!-- FR: left from 5, up, right to 0 -->
  <path d="M80 160 L20 160 L20 57 L78 57" fill="none" stroke="#FF79C6" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr-pink)"/>
  <text x="10" y="112" font-size="11" fill="#FF79C6" font-family="sans-serif" text-anchor="middle">FR</text>
</svg>
